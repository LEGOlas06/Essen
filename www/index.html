.small{font-size:13px}

.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px}

input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;min-width:0}

.num{font-variant-numeric:tabular-nums}

.streak{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}

.dot.today{border-style:dashed;border-color:var(--flame)}
.dot svg{width:14px;height:14px}
.progress{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.progress>i{display:block;height:100%;border-radius:99px;background:var(--accent)}
/* summary */
.sum{display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:center}
.ring{position:relative;width:120px;height:120px}

.mac{display:flex;flex-direction:column;gap:9px}

.meal-h{display:flex;align-items:center;justify-content:space-between;padding-block:4px}
.entry{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}

.micro{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px}
.mi .l{display:flex;justify-content:space-between;font-size:12.5px;gap:6px;margin-bottom:3px}

.seg{display:flex;background:var(--surface2);border-radius:10px;padding:3px;gap:3px}

.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:10px;padding:10px 2px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;border-radius:0;text-align:left;width:100%;font-weight:400}

.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.03em;padding:2px 7px;border-radius:99px;background:var(--surface2);color:var(--muted);white-space:nowrap}

function today(){const d=new Date();return ymd(d)}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function addDays(s,n){const [y,m,d]=s.split('-').map(Number);const x=new Date(y,m-1,d+n);return ymd(x)}
function dObj(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function guessMeal(){const h=new Date().getHours();return h<10?'b':h<15?'l':h<21?'d':'s'}
const WD=['So','Mo','Di','Mi','Do','Fr','Sa'];
function fmtDate(s){const t=today(); if(s===t)return 'Heute'; if(s===addDays(t,-1))return 'Gestern'; const d=dObj(s); return WD[d.getDay()]+', '+d.getDate()+'.'+(d.getMonth()+1)+'.'}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function r1(x){return Math.round(x*10)/10}
function fmt(x,k){if(x==null||isNaN(x))return '–'; const a=Math.abs(x); const v=(k==='kcal'||a>=100)?Math.round(x):a>=10?r1(x):Math.round(x*100)/100; return String(v).replace('.',',')}
function zero(){return NK.map(()=>0)}
function addTo(t,v,f=1){for(let i=0;i<t.length;i++)t[i]+=(v[i]||0)*f;return t}
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ß/g,'ss')}
let toastT; function toast(m){clearTimeout(toastT);let el=document.querySelector('.toast'); if(!el){el=document.createElement('div');el.className='toast';el.setAttribute('role','status');document.body.appendChild(el)} el.textContent=m; toastT=setTimeout(()=>el.remove(),2600)}

function getFood(id){ if(id&&id.startsWith('ch')&&CHI.has(id.slice(2))){const x=CHI.get(id.slice(2));return {id,name:x[1],cat:x[2],portions:[],per:x[4].map(v=>v||0),src:'ch',micros:MICRO.some(k=>x[4][IDX[k]]!=null)}} if(F[id]){const f=F[id];return {id,name:f[0],cat:f[1],portions:f[2],per:f[3],src:'db',micros:true}} return S.foods[id]||null }
function allRecipes(){return [...R0,...Object.values(S.recipes)]}
function getRecipe(id){return R0.find(r=>r.id===id)||S.recipes[id]||null}
function recipeCalc(r){const tot=zero();let g=0,missing=[];for(const [fid,gr] of r.ing){const f=getFood(fid); if(!f){missing.push(fid);continue} addTo(tot,f.per,gr/100); g+=gr} const per=tot.map(v=>v/r.yield); return {tot,per,grams:g/r.yield,missing}}
function dayGoal(d){const b=S.body[d]; return Math.round(S.settings.kcal+(S.settings.useBurn&&b&&b.burn?b.burn*S.settings.burnFactor:0))}
function dayTotals(d){const t=zero();(S.days[d]||[]).forEach(e=>addTo(t,e.n));return t}

/* ---------- Streak ---------- */
function streakInfo(){
  const t=today(); const logged=new Set(Object.keys(S.days).filter(d=>S.days[d]&&S.days[d].length));
  const res={cur:0,best:0,freezes:0,frozen:new Set(),todayDone:logged.has(t),logged,total:logged.size};
  if(!logged.size)return res;
  let d=[...logged].sort()[0]; let cur=0,best=0,fr=0;
  while(d<=t){
    if(logged.has(d)){cur++; if(cur%7===0&&fr<2)fr++}
    else if(d!==t){ if(cur>0&&fr>0){fr--;res.frozen.add(d)} else cur=0 }
    best=Math.max(best,cur); d=addDays(d,1);
  }
  res.cur=cur;res.best=best;res.freezes=fr;return res;
}

function searchLocal(q){
  const n=norm(q.trim()); const out=[];
  const match=s=>!n||norm(s).includes(n);
  allRecipes().forEach(r=>{if(n&&match(r.name))out.push({kind:'r',id:r.id,name:r.name,tag:SRC[r.src],kcal:recipeCalc(r).per[0],unit:'1 '+r.unit})});
  Object.values(S.foods).forEach(f=>{if(n&&match(f.name+' '+(f.brand||'')))out.push({kind:'f',id:f.id,name:f.name,brand:f.brand,tag:['Gespeichert','own'],kcal:f.per[0],unit:'100 g'})});
  Object.keys(F).forEach(id=>{if(n&&match(F[id][0]+' '+F[id][1]))out.push({kind:'f',id,name:F[id][0],tag:[F[id][1],''],kcal:F[id][3][0],unit:'100 g'})});
  if(n){const words=n.split(/\s+/).filter(Boolean); const hits=CH.filter(x=>{const t=norm(x[1]+' '+x[2]);return words.every(w=>t.includes(w))});
    hits.sort((a,b)=>(norm(a[1]).startsWith(words[0])?0:1)-(norm(b[1]).startsWith(words[0])?0:1)||a[1].length-b[1].length);
    hits.slice(0,30).forEach(x=>out.push({kind:'f',id:'ch'+x[0],name:x[1],tag:[x[3]?'Schweiz · Marke':'Schweiz',''],kcal:x[4][0],unit:'100 g'}))}
  return out.slice(0,60);
}

/* Open Food Facts */
const OFFMAP={vA:['vitamin-a',1e6],vC:['vitamin-c',1e3],vD:['vitamin-d',1e6],vE:['vitamin-e',1e3],vK:['vitamin-k',1e6],b1:['vitamin-b1',1e3],b2:['vitamin-b2',1e3],b6:['vitamin-b6',1e3],b12:['vitamin-b12',1e6],fol:['vitamin-b9',1e6],ca:['calcium',1e3],mg:['magnesium',1e3],fe:['iron',1e3],zn:['zinc',1e3],k:['potassium',1e3]};
const OFF_FIELDS='code,product_name,product_name_de,brands,nutriments,serving_quantity';
function offToFood(p){
  const n=p.nutriments||{}; const g=k=>{const v=n[k+'_100g'];return v==null||v===''?null:Number(v)};
  let kcal=g('energy-kcal'); if(kcal==null&&g('energy')!=null)kcal=g('energy')/4.184;
  const per=zero(); per[0]=kcal||0; per[1]=g('proteins')||0; per[2]=g('carbohydrates')||0; per[3]=g('sugars')||0; per[4]=g('fat')||0; per[5]=g('saturated-fat')||0; per[6]=g('fiber')||0; per[7]=g('salt')!=null?g('salt'):(g('sodium')||0)*2.5;
  let any=false; for(const k of MICRO){const [key,mul]=OFFMAP[k]; let v=g(key); if(k==='fol'&&v==null)v=g('folates'); if(v!=null){per[IDX[k]]=v*mul;any=true}}
  const name=(p.product_name_de||p.product_name||'Unbenanntes Produkt').trim();
  const portions=p.serving_quantity?[['1 Portion',Math.round(Number(p.serving_quantity))]]:[];
  return {id:'off-'+p.code,code:p.code,name,brand:(p.brands||'').split(',')[0].trim(),per:per.map(v=>Math.round(v*1000)/1000),portions,src:'off',micros:any};
}
async function offFetch(url){const r=await fetch(url,{headers:{'Accept':'application/json'}}); if(!r.ok)throw new Error('HTTP '+r.status); return r.json()}
const NOONLINE_A='Die Online-Suche (Open Food Facts) ist in dieser Ansicht gesperrt. Öffne die App-Datei direkt im Handy-Browser, dann gehen Barcode-Scan und Online-Suche. Bis dahin: lokale Datenbank nutzen oder Produkt selbst anlegen (Nährwerte stehen auf der Packung).';
const NOONLINE_F='Open Food Facts ist gerade nicht erreichbar. Prüf deine Internetverbindung und versuch es gleich nochmal.';
function noOnline(){return (window.claude&&window.claude.use)?NOONLINE_A:NOONLINE_F}
async function lookupBarcode(code){
  code=String(code).replace(/\D/g,''); if(code.length<6){toast('Das sieht nicht nach einem Barcode aus.');return}
  const known=S.foods['off-'+code]; if(known){openAmount('f',known.id,known);return}
  UI.onlineState='Suche Barcode '+code+' …'; render();
  try{const j=await offFetch(`https://world.openfoodfacts.org/api/v2/product/${code}.json?fields=${OFF_FIELDS}`);
    if(j.status!==1||!j.product){UI.onlineState=`Barcode ${code} ist bei Open Food Facts nicht bekannt. Leg das Produkt selbst an.`;render();return}
    const f=offToFood(j.product); S.foods[f.id]=f; Store.saveMeta(); UI.onlineState=''; render(); openAmount('f',f.id,f);
  }catch(e){UI.onlineState=noOnline();render()}
}
async function searchOnline(){

  searchUSDA(q).then(r=>{UI.usda=r.foods; UI.usdaState=r.foods.length?'':`Keine USDA-Treffer für „${r.qe}“. Tipp: auf Englisch suchen.`; render()}).catch(e=>{UI.usdaState=(window.claude&&window.claude.use)?'':(/429/.test(e.message)?'USDA: Limit für den Demo-Schlüssel erreicht. Unter „Ziele“ kannst du einen eigenen kostenlosen Schlüssel eintragen.':'USDA-Datenbank gerade nicht erreichbar.'); render()});
  UI.onlineState='Suche bei Open Food Facts …'; UI.online=[]; render();
  try{let prods;
    try{const j=await offFetch(`https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=20&lc=de&cc=de&fields=${OFF_FIELDS}`); prods=j.products||[]}
    catch(e1){const j=await offFetch(`https://search.openfoodfacts.org/search?q=${encodeURIComponent(q)}&page_size=20&langs=de&fields=${OFF_FIELDS}`); prods=(j.hits||[]).map(h=>({...h,brands:Array.isArray(h.brands)?h.brands.join(','):h.brands}))}
    UI.online=prods.filter(p=>p.code&&p.nutriments).map(offToFood).filter(f=>f.per[0]>0);
    UI.onlineState=UI.online.length?'':'Keine Treffer bei Open Food Facts.'; render();
  }catch(e){UI.onlineState=noOnline();render()}

/* USDA FoodData Central: sehr vollständige Vitamin- und Mineralstoffwerte, englische Namen */
const FDC={1008:['kcal',1],2047:['kcal',1],1003:['prot',1],1005:['carb',1],2000:['sugar',1],1004:['fat',1],1258:['sat',1],1079:['fib',1],1093:['salt',0.0025],1106:['vA',1],1162:['vC',1],1114:['vD',1],1109:['vE',1],1185:['vK',1],1165:['b1',1],1166:['b2',1],1175:['b6',1],1178:['b12',1],1177:['fol',1],1190:['fol',1],1087:['ca',1],1090:['mg',1],1089:['fe',1],1095:['zn',1],1092:['k',1]};
const DE_EN={apfel:'apple',banane:'banana',birne:'pear',orange:'orange',erdbeere:'strawberries',erdbeeren:'strawberries',heidelbeeren:'blueberries',himbeeren:'raspberries',trauben:'grapes',weintrauben:'grapes',kiwi:'kiwifruit',mango:'mango',ananas:'pineapple',zitrone:'lemon',avocado:'avocado',tomate:'tomato',tomaten:'tomatoes',gurke:'cucumber',karotte:'carrot',karotten:'carrots',moehre:'carrot',paprika:'pepper sweet red',zwiebel:'onion',knoblauch:'garlic',kartoffel:'potato',kartoffeln:'potatoes',suesskartoffel:'sweet potato',brokkoli:'broccoli',blumenkohl:'cauliflower',spinat:'spinach',salat:'lettuce',kohl:'cabbage',rotkohl:'red cabbage',gruenkohl:'kale',zucchini:'zucchini',aubergine:'eggplant',kuerbis:'pumpkin',pilze:'mushrooms',champignons:'mushrooms',erbsen:'peas',mais:'corn',bohnen:'beans',kidneybohnen:'kidney beans',linsen:'lentils',kichererbsen:'chickpeas',tofu:'tofu',reis:'rice',nudeln:'pasta',haferflocken:'oats',hafer:'oats',brot:'bread',vollkornbrot:'whole wheat bread',quinoa:'quinoa',hirse:'millet',buchweizen:'buckwheat',ei:'egg',eier:'egg',milch:'milk',joghurt:'yogurt',quark:'quark',kaese:'cheese',butter:'butter',sahne:'cream',honig:'honey',zucker:'sugar',walnuss:'walnuts',walnuesse:'walnuts',mandeln:'almonds',haselnuesse:'hazelnuts',erdnuesse:'peanuts',cashew:'cashew',sonnenblumenkerne:'sunflower seeds',kuerbiskerne:'pumpkin seeds',leinsamen:'flaxseed',chia:'chia seeds',sesam:'sesame seeds',olivenoel:'olive oil',rapsoel:'canola oil',lachs:'salmon',thunfisch:'tuna',haehnchen:'chicken breast',huhn:'chicken',rind:'beef',schwein:'pork',schokolade:'chocolate dark',kakao:'cocoa',kaffee:'coffee',tee:'tea',bier:'beer',wein:'wine',saft:'juice',roh:'raw',gekocht:'cooked',gebraten:'fried'};
function toEnglish(q){return norm(q).split(/\s+/).map(w=>DE_EN[w.replace(/[^a-z]/g,'')]||w).join(' ')}
function fdcToFood(f){const per=zero(); let any=false; const seen={};
  for(const n of (f.foodNutrients||[])){const id=n.nutrientId||n.nutrientNumber; const m=FDC[id]; if(!m||n.value==null)continue; const [k,mul]=m; if(seen[k]&&k!=='fol')continue;
    if(n.unitName&&n.unitName.toUpperCase()==='KJ')continue; per[IDX[k]]=n.value*mul; seen[k]=1; if(MICRO.includes(k)&&n.value>0)any=true}
  const name=String(f.description||'').toLowerCase().replace(/(^|,\s*)\w/g,x=>x.toUpperCase());
  return {id:'fdc-'+f.fdcId,code:'fdc-'+f.fdcId,name,brand:f.brandOwner||'',per:per.map(v=>Math.round(v*1000)/1000),portions:[],src:'usda',micros:any}}
async function searchUSDA(q){
  const key=S.settings.fdcKey||'DEMO_KEY'; const qe=toEnglish(q);
  const j=await offFetch(`https://api.nal.usda.gov/fdc/v1/foods/search?api_key=${encodeURIComponent(key)}&query=${encodeURIComponent(qe)}&dataType=Foundation,SR%20Legacy&pageSize=15`);
  return {foods:(j.foods||[]).map(fdcToFood).filter(f=>f.per[0]>0),qe}}

let scanner=null;
function loadScript(src){return new Promise((res,rej)=>{if(document.querySelector(`script[src="${src}"]`)){res();return} const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
async function ensureLib(){await loadScript('https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js')}
async function startScan(){
  UI.scanning=true; render();
  try{await ensureLib(); const fmts=window.Html5QrcodeSupportedFormats;
    scanner=new Html5Qrcode('reader',{formatsToSupport:fmts?[fmts.EAN_13,fmts.EAN_8,fmts.UPC_A,fmts.UPC_E]:undefined,verbose:false});
    await scanner.start({facingMode:'environment'},{fps:10,qrbox:(w,h)=>({width:Math.min(300,w*0.85),height:Math.min(140,h*0.5)})},code=>{stopScan();lookupBarcode(code)},()=>{});
  }catch(e){UI.scanning=false; scanner=null; UI.onlineState='Die Kamera ist hier nicht verfügbar. Öffne die App-Datei direkt im Handy-Browser (und erlaube den Kamerazugriff) oder nutze „Foto“ bzw. tippe die Nummer ein.'; render()}

async function scanPhoto(file){
  UI.onlineState='Lese Barcode aus dem Foto …'; render();
  try{
    if('BarcodeDetector' in window){const bd=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']}); const bmp=await createImageBitmap(file); const r=await bd.detect(bmp); if(r[0]){UI.onlineState='';lookupBarcode(r[0].rawValue);return}}
    await ensureLib(); const div=document.createElement('div');div.id='tmpreader';div.hidden=true;document.body.appendChild(div);
    const h=new Html5Qrcode('tmpreader'); const code=await h.scanFile(file,false); h.clear(); div.remove(); UI.onlineState=''; lookupBarcode(code);
  }catch(e){document.getElementById('tmpreader')?.remove(); UI.onlineState='Im Foto wurde kein Barcode gefunden. Versuch es näher und schärfer oder tippe die Nummer ein.'; render()}

/* ---------- Zielrechner (Studienbasis siehe Quellen im Ziele-Tab) ---------- */
const PALS=[[1.2,'Kaum Bewegung (fast nur sitzen/liegen)'],[1.4,'Sitzend, wenig Freizeitbewegung'],[1.6,'Sitzend mit Sport oder viel Gehen/Stehen'],[1.8,'Körperlich aktiv oder fast täglich Sport'],[2.0,'Schwere Arbeit oder Leistungssport']];
function macrosFor(kcal,p){const w=+p.weight||70; const pk=p.strength?(p.goal==='lose'?2.0:1.6):(p.goal==='lose'?1.2:1.0);
  const prot=Math.round(w*pk), fat=Math.round(kcal*0.3/9), fib=Math.max(30,Math.round(kcal/1000*14)), carb=Math.max(0,Math.round((kcal-prot*4-fat*9-fib*2)/4)); return {prot,fat,fib,carb,pk}}
function goalAdj(tdee,p){if(p.goal==='lose')return -Math.min(p.rate*7700/7,tdee*0.25); if(p.goal==='gain')return Math.min(p.rate*7700/7,500); return 0}
function calcGoals(p){const w=+p.weight,h=+p.height,a=+p.age; if(!(w>0&&h>0&&a>0))return null;
  const bmr=10*w+6.25*h-5*a+(p.sex==='m'?5:-161); const pal=p.useBurn?1.3:+p.pal; const tdee=bmr*pal; const adj=goalAdj(tdee,p);
  let kcal=tdee+adj, floor=false; if(p.goal==='lose'&&kcal<bmr){kcal=bmr;floor=true} kcal=Math.round(kcal/10)*10;
  return {bmr,pal,tdee,adj,kcal,floor,...macrosFor(kcal,p)}}
function adaptive(){const days=rangeDays(28); const ws=days.map((d,i)=>[i,S.body[d]&&S.body[d].w]).filter(x=>x[1]>0); const logged=days.filter(d=>S.days[d]&&S.days[d].length);
  const span=ws.length?ws[ws.length-1][0]-ws[0][0]:0;
  if(ws.length<4||logged.length<14||span<13)return {ok:false,ws:ws.length,logged:logged.length,span};
  const mx=ws.reduce((a,x)=>a+x[0],0)/ws.length, my=ws.reduce((a,x)=>a+x[1],0)/ws.length;
  const slope=ws.reduce((a,x)=>a+(x[0]-mx)*(x[1]-my),0)/ws.reduce((a,x)=>a+(x[0]-mx)**2,0);
  const intake=logged.reduce((a,d)=>a+dayTotals(d)[0],0)/logged.length; const tdee=intake-slope*7700;
  return {ok:true,tdee,slope,intake,logged:logged.length,ws:ws.length}}
/* Samsung Health / Health Connect: CSV- oder ZIP-Export einlesen (experimentell) */
function splitCSV(line,sep){const out=[];let cur='',q=false;for(let i=0;i<line.length;i++){const c=line[i];if(q){if(c==='"'){if(line[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}else if(c==='"')q=true;else if(c===sep){out.push(cur);cur=''}else cur+=c}out.push(cur);return out}
function parseDateAny(v){v=String(v||'').trim(); if(/^\d{12,13}$/.test(v))return ymd(new Date(+v)); let m=v.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m)return m[1]+'-'+m[2]+'-'+m[3]; m=v.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})/); if(m)return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0'); return null}
function parseHealthCSV(text,name){
  let lines=text.split(/\r?\n/).filter(l=>l.trim()); const res={burn:{},w:{}}; if(lines.length<2)return res;
  const cnt=(l,c)=>l.split(c).length; const sep=cnt(lines[0],';')>cnt(lines[0],',')?';':(cnt(lines[1],';')>cnt(lines[1],',')?';':',');
  if(/^com\.samsung/i.test(lines[0])&&cnt(lines[0],sep)<6)lines=lines.slice(1);
  const head=splitCSV(lines[0],sep).map(h=>h.trim().toLowerCase());
  const find=(...res_)=>{for(const re of res_){const i=head.findIndex(h=>re.test(h)); if(i>=0)return i}return -1};
  const di=find(/(^|\.)day_time$/,/(^|\.)start_time$/,/^(datum|date|tag|day)$/,/date|datum|time/);
  const ci=find(/(^|\.)active_calorie$/,/(^|\.)calorie$/,/aktiv.*kal|active.*cal/,/^(kcal|kalorien|calories)$/,/calor|kalor/);
  const wi=find(/(^|\.)weight$/,/^gewicht/,/weight|gewicht/);
  if(di<0)return res; const isW=/weight|gewicht/i.test(name)||(wi>=0&&ci<0);
  for(const l of lines.slice(1)){const c=splitCSV(l,sep); const d=parseDateAny(c[di]); if(!d)continue;
    if(isW&&wi>=0){const w=parseFloat(String(c[wi]).replace(',','.')); if(w>20&&w<400)res.w[d]=Math.round(w*10)/10}
    else if(ci>=0){const k=parseFloat(String(c[ci]).replace(',','.')); if(k>=0&&k<10000)res.burn[d]=Math.max(res.burn[d]||0,Math.round(k))}}
  return res}
async function importHealth(files){
  const all={burn:{},w:{}}; const merge=r=>{Object.assign(all.w,r.w);for(const d in r.burn)all.burn[d]=Math.max(all.burn[d]||0,r.burn[d])};
  try{for(const f of files){
    if(/\.zip$/i.test(f.name)){await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js'); const z=await JSZip.loadAsync(f);
      for(const n of Object.keys(z.files)){if(/\.csv$/i.test(n)&&/(day_summary|weight|calorie|kalorie|gewicht)/i.test(n))merge(parseHealthCSV(await z.files[n].async('string'),n))}}
    else merge(parseHealthCSV(await f.text(),f.name))}
    const nb=Object.keys(all.burn).length, nw=Object.keys(all.w).length;
    if(!nb&&!nw){toast('In der Datei wurden keine Kalorien- oder Gewichtsdaten erkannt.');return}
    for(const d in all.burn)(S.body[d]=S.body[d]||{}).burn=all.burn[d]; for(const d in all.w)(S.body[d]=S.body[d]||{}).w=all.w[d];
    await Store.saveMeta(); toast(`Importiert: ${nb} Tage Verbrauch, ${nw} Gewichtswerte`); render();
  }catch(e){toast('Import fehlgeschlagen. Ist es eine CSV- oder ZIP-Datei aus Samsung Health?')}
}

/* Health Connect live (nur in der Android-App, über capacitor-health) */
function nativeHealth(){try{return window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform()&&Capacitor.Plugins&&Capacitor.Plugins.HealthPlugin||null}catch(e){return null}}
let hcBusy=false;
async function syncHealth(interactive){
  const H=nativeHealth(); if(!H||hcBusy)return; hcBusy=true;
  try{const av=await H.isHealthAvailable(); if(!av.available){if(interactive){toast('Health Connect ist nicht installiert.');try{await H.showHealthConnectInPlayStore()}catch(e){}}return}
    if(interactive)await H.requestHealthPermissions({permissions:['READ_ACTIVE_CALORIES','READ_STEPS','READ_WEIGHT']});
    const end=new Date(), start=new Date(); start.setDate(start.getDate()-29); start.setHours(0,0,0,0);
    const {aggregatedData}=await H.queryAggregated({startDate:start.toISOString(),endDate:end.toISOString(),dataType:'active-calories',bucket:'day'});
    (aggregatedData||[]).forEach(x=>{const d=ymd(new Date(x.startDate)); if(x.value>0){const b=(S.body[d]=S.body[d]||{}); b.burn=Math.round(x.value); b.hc=1}});
    try{const st=await H.queryAggregated({startDate:start.toISOString(),endDate:end.toISOString(),dataType:'steps',bucket:'day'});
      (st.aggregatedData||[]).forEach(x=>{const d=ymd(new Date(x.startDate)); if(x.value>0){const b=(S.body[d]=S.body[d]||{}); b.steps=Math.round(x.value); b.hc=1}})}catch(e){}
    try{const {records}=await H.queryRecords({startDate:start.toISOString(),endDate:end.toISOString(),dataType:'weight'});
      (records||[]).forEach(r=>{const d=ymd(new Date(r.startDate)); const b=(S.body[d]=S.body[d]||{}); b.w=Math.round(r.value*10)/10; b.hc=1});
      const last=(records||[]).slice(-1)[0]; if(last)S.settings.weight=Math.round(last.value*10)/10}catch(e){}
    if(interactive&&!S.settings.hcSync)S.settings.useBurn=true;
    S.settings.hcSync=true; S.settings.hcLast=Date.now(); await Store.saveMeta(); render(); if(interactive)toast('Health Connect synchronisiert');
  }catch(e){if(interactive)toast('Health Connect: '+(e&&e.message||'Zugriff nicht erlaubt'))}
  finally{hcBusy=false}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&S.settings.hcSync)syncHealth(false)});

   <li>Grundumsatz: Mifflin-St-Jeor-Formel (Mifflin et al., Am J Clin Nutr 1990). In einer Übersichtsarbeit die genaueste Standardformel (Frankenfield et al., J Am Diet Assoc 2005).</li>

   <li>Defizit: ca. 7.700 kcal pro kg Körperfett, höchstens 25 % unter Bedarf und nicht unter Grundumsatz. Weil sich der Körper anpasst (Hall et al., Lancet 2011), korrigiert die App das Ziel später mit deinem echten Gewichtsverlauf.</li>

/* ---------- Sheet ---------- */
function openSheet(html){document.getElementById('sheetRoot').innerHTML=`<div class="sheet-bg" data-act="bg"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`}
function closeSheet(){document.getElementById('sheetRoot').innerHTML='';UI.nr=null}

/* ---------- Events ---------- */
document.addEventListener('click',async ev=>{
  const tb=ev.target.closest('[data-tab]'); if(tb){if(UI.scanning)await stopScan(); UI.tab=tb.dataset.tab; if(UI.tab==='add')UI.focusQ=false; window.scrollTo(0,0); render(); return}
  const el=ev.target.closest('[data-act]'); if(!el)return; const a=el.dataset.act;
  if(a==='bg'){if(ev.target===el)closeSheet();return}
  switch(a){
    case 'close':closeSheet();break;
    case 'day':UI.date=addDays(UI.date,+el.dataset.d); if(UI.date>today())UI.date=today(); render();break;
    case 'addmeal':UI.meal=el.dataset.meal;UI.tab='add';UI.focusQ=true;render();break;
    case 'delentry':S.days[UI.date]=(S.days[UI.date]||[]).filter(e=>e.id!==el.dataset.id);Store.saveDay(UI.date);render();toast('Eintrag gelöscht');break;
    case 'meal':UI.meal=el.dataset.meal;render();break;
    case 'pick':{const k=el.dataset.kind,id=el.dataset.id; if(k==='o'){const f=UI.online.find(x=>x.code===id)||UI.usda.find(x=>x.code===id); S.foods[f.id]=f; Store.saveMeta(); openAmount('f',f.id,f)} else openAmount(k,id); break}
    case 'quick':UI.amt.amt=+el.dataset.v;sheetAmount();break;
    case 'addentry':addEntry();break;
    case 'scan':startScan();break;
    case 'stopscan':stopScan();break;
    case 'photo':document.getElementById('barcodeImg').click();break;
    case 'online':searchOnline();break;
    case 'ean':lookupBarcode(document.getElementById('ean').value);break;
    case 'newfood':sheetNewFood();break;
    case 'savefood':saveFood();break;
    case 'recipe':sheetRecipe(el.dataset.id);break;
    case 'logrecipe':closeSheet();openAmount('r',el.dataset.id);break;
    case 'delrecipe':delete S.recipes[el.dataset.id];Store.saveMeta();closeSheet();render();toast('Rezept gelöscht');break;
    case 'newrecipe':sheetNewRecipe();break;
    case 'ingadd':UI.nr.ing.push([el.dataset.id,100]);UI.nr.q='';drawNewRecipe();break;
    case 'ingdel':UI.nr.ing.splice(+el.dataset.i,1);drawNewRecipe();break;
    case 'saverecipe':{const nr=UI.nr; nr.name=document.getElementById('nr-name').value.trim(); nr.yield=Math.max(1,parseInt(document.getElementById('nr-yield').value)||1);
      if(!nr.name||!nr.ing.length){toast('Name und mindestens eine Zutat fehlen.');break}
      const r={id:'c-'+uid(),name:nr.name,src:'custom',yield:nr.yield,unit:'Portion',ing:nr.ing.filter(x=>x[1]>0)}; S.recipes[r.id]=r; Store.saveMeta(); closeSheet(); UI.tab='rezepte'; render(); toast('Rezept gespeichert'); break}
    case 'ideachip':UI.idea=el.dataset.v;render();break;
    case 'idea':recipeIdea();break;
    case 'range':UI.range=+el.dataset.n;render();break;
    case 'csv-entries':saveFile('tellerflamme-eintraege-'+today()+'.csv','﻿'+csvEntries(),'text/csv');break;
    case 'csv-days':saveFile('tellerflamme-tage-'+today()+'.csv','﻿'+csvDays(),'text/csv');break;
    case 'json':saveFile('tellerflamme-backup-'+today()+'.json',JSON.stringify({app:'tellerflamme',version:1,exported:new Date().toISOString(),...S},null,1),'application/json');break;
    case 'import':document.getElementById('importFile').click();break;
    case 'copysum':copySummary();break;
    case 'savegoals':['kcal','prot','carb','fat','fib'].forEach(k=>{const v=parseInt(document.getElementById('g-'+k).value);if(v>0)S.settings[k]=v}); S.settings.sex=document.getElementById('g-sex').value; Store.saveMeta(); toast('Ziele gespeichert'); render();break;
    case 'calc':{const p=readProfile(); Object.assign(S.settings,{age:p.age,height:p.height,weight:p.weight,sex:p.sex,useBurn:p.useBurn,pal:p.pal,goal:p.goal,rate:p.rate,strength:p.strength}); Store.saveMeta(); const c=calcGoals(p); UI.calc=c||{err:'Bitte Alter, Größe und Gewicht eintragen.'}; render(); break}
    case 'applycalc':{const c=UI.calc; if(!c||c.err)break; Object.assign(S.settings,{kcal:c.kcal,prot:c.prot,carb:c.carb,fat:c.fat,fib:c.fib}); Store.saveMeta(); UI.calc=null; render(); toast('Tagesziele übernommen'); break}
    case 'applyadaptive':{const k=+el.dataset.k; const m=macrosFor(k,S.settings); Object.assign(S.settings,{kcal:k,prot:m.prot,carb:m.carb,fat:m.fat,fib:m.fib}); Store.saveMeta(); render(); toast('Ziel angepasst: '+k+' kcal'); break}
    case 'savefdc':S.settings.fdcKey=document.getElementById('g-fdc').value.trim();Store.saveMeta();toast('Gespeichert');break;
    case 'hc':syncHealth(true);break;
    case 'health':document.getElementById('healthFile').click();break;
    case 'reset':UI.confirmReset=true;render();break;
    case 'reset-no':UI.confirmReset=false;render();break;
    case 'reset-yes':{const old=Object.keys(S.days); S={settings:{...S.settings},foods:{},recipes:{},days:{}}; UI.confirmReset=false;
      if(Store.mode==='db'){try{for(const d of old)await Store.db.collection(Store.base).doc('day-'+d).delete()}catch(e){}} await Store.saveMeta(); render(); toast('Alle Daten gelöscht'); break}
  }
});
document.addEventListener('input',ev=>{

setInterval(()=>{if(UI.date>today()||(UI.lastToday&&UI.lastToday!==today()&&UI.date===UI.lastToday)){UI.date=today();render()} UI.lastToday=today()},60000);

loadLocal(); UI.lastToday=today(); render(); connectCloud(); if(S.settings.hcSync)setTimeout(()=>syncHealth(false),800);
