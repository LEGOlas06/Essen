name: Android-App bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Abhängigkeiten
        run: npm install
      - name: Versionsnummer eintragen (für das Selbst-Update)
        run: |
          V=$(sha256sum www/index.html | cut -c1-12)
          sed -i "s/__APP_VERSION__/$V/" www/index.html
          echo "Version $V"
      - name: Android-Projekt erzeugen
        run: npm run android:prepare
      - name: Signatur-Schlüssel (gleich bleibend, damit Updates ohne Neuinstallation gehen)
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore; else cp signing/debug.keystore ~/.android/debug.keystore; echo "Nutze den Schlüssel aus signing/debug.keystore"; fi
      - name: Gradle zwischenspeichern
        uses: gradle/actions/setup-gradle@v4
      - name: APK bauen
        working-directory: android
        run: |
          chmod +x gradlew
          # Gradle-Download ist manchmal langsam oder liefert 504: längeres Timeout und bis zu 4 Versuche
          sed -i 's/^networkTimeout=.*/networkTimeout=120000/' gradle/wrapper/gradle-wrapper.properties || true
          grep -q '^networkTimeout=' gradle/wrapper/gradle-wrapper.properties || echo 'networkTimeout=120000' >> gradle/wrapper/gradle-wrapper.properties
          for i in 1 2 3 4; do ./gradlew assembleDebug --no-daemon && break; if [ $i = 4 ]; then exit 1; fi; echo "Versuch $i fehlgeschlagen, warte $((i*30)) s"; sleep $((i*30)); done
          cp app/build/outputs/apk/debug/app-debug.apk ../tellerflamme.apk
      - name: Als Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: Tellerflamme (neueste Version)
          body: "Automatisch gebaut aus ${{ github.sha }}. tellerflamme.apk auf dem Handy herunterladen und installieren."
          files: tellerflamme.apk
          # Vorabversion, damit HACS (Home Assistant) die Erweiterung aus den ha-v…-Releases nimmt und nicht die APK
          prerelease: true
          make_latest: false
