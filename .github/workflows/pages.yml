name: Webseite veröffentlichen

on:
  push:
    branches: [main]
    paths: ['www/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Bauen und Veröffentlichen sind getrennte Jobs: Direkt nach dem Hochladen fand
  # deploy-pages das Paket manchmal noch nicht ("No artifacts named github-pages").
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Seite und Update-Paket bauen
        run: |
          V=$(sha256sum www/index.html | cut -c1-12)
          mkdir site && cp -r www/. site/
          sed -i "s/__APP_VERSION__/$V/" site/index.html
          (cd site && zip -qr ../update.zip .)
          mv update.zip site/
          C=$(sha256sum site/update.zip | cut -d' ' -f1)
          echo "{\"version\":\"$V\",\"checksum\":\"$C\"}" > site/version.json
          echo "Version $V"
      # Name je Versuch, damit "Re-run" nicht an zwei gleichnamigen Paketen scheitert
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          name: github-pages-${{ github.run_attempt }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d2.outputs.page_url || steps.d1.outputs.page_url }}
    steps:
      - id: d1
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Kurz warten, falls GitHub das Paket noch nicht kennt
        if: steps.d1.outcome == 'failure'
        run: sleep 45
      - id: d2
        if: steps.d1.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
